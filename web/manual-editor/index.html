<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manual Video Editor</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-row">
          <span class="back-mark">‹</span>
          <h1>Canvas</h1>
          <p id="statusText">Ready</p>
        </div>
        <div class="toolbar" aria-label="Editor actions">
          <button id="projectButton" class="button ghost utility-action">Project JSON</button>
          <button id="jobButton" class="button ghost utility-action">Job JSON</button>
          <button id="saveButton" class="button ghost cloud-action" type="button">Sync cloud</button>
          <button id="loadButton" class="button ghost" type="button">Load local</button>
          <button id="exportButton" class="button primary">Export</button>
        </div>
      </header>

      <section class="workspace">
        <nav class="tool-rail" aria-label="Editor sections">
          <button class="rail-item active" type="button">
            <span class="rail-icon">▧</span>
            <span>Local</span>
          </button>
          <button class="rail-item" type="button">
            <span class="rail-icon">□</span>
            <span>Project</span>
          </button>
          <button class="rail-item" type="button">
            <span class="rail-icon">◷</span>
            <span>History</span>
          </button>
          <button class="rail-item" type="button">
            <span class="rail-icon">T</span>
            <span>Text</span>
          </button>
          <button class="rail-item rail-bottom" type="button">
            <span class="rail-icon">⚙</span>
          </button>
        </nav>

        <aside class="media-panel" aria-label="Media bin">
          <div class="panel-head">
            <h2>Local media</h2>
            <span id="mediaCount">0</span>
          </div>
          <input id="mediaSearch" class="media-search" type="search" placeholder="Search media" aria-label="Search media">
          <div class="media-tabs" aria-label="Media filters">
            <button class="media-tab active" type="button" data-filter="all">All</button>
            <button class="media-tab" type="button" data-filter="video">Video</button>
            <button class="media-tab" type="button" data-filter="audio">Audio</button>
            <button class="media-tab" type="button" data-filter="image">Image</button>
          </div>
          <label class="import-drop">
            <span>Import</span>
            <small>Video / Audio</small>
            <input id="fileInput" type="file" accept="video/*,audio/*" multiple>
          </label>
          <div id="mediaList" class="media-list"></div>
        </aside>

        <section class="editor-main">
          <div class="upper-editor">
            <section class="preview-panel" aria-label="Preview">
              <div class="preview-frame">
                <video id="previewVideo" playsinline></video>
                <div id="emptyPreview" class="empty-preview">Preview</div>
              </div>
              <div class="preview-footer">
                <span id="timeReadout" class="timecode">00:00 / 00:00</span>
                <button id="playButton" class="play-button" aria-label="Play or pause">▶</button>
                <div class="preview-actions">
                  <span>24fps</span>
                  <span>Fit</span>
                  <span>100%</span>
                </div>
                <input id="seekSlider" type="range" min="0" max="1000" value="0" aria-label="Preview position">
              </div>
            </section>

            <aside class="inspector" aria-label="Clip inspector">
              <div class="inspector-tabs hidden">
                <button class="tab active" type="button" data-inspector-tab="position">Position & Scale</button>
                <button class="tab" type="button" data-inspector-tab="speed">Speed</button>
                <button class="tab" type="button" data-inspector-tab="blend">Blend</button>
                <button class="tab" type="button" data-inspector-tab="mask">Mask</button>
              </div>
              <div id="inspectorEmpty" class="inspector-empty">Select a timeline clip</div>
              <form id="clipForm" class="clip-form hidden">
                <input id="clipName" type="text" aria-label="Clip name">
                <input id="clipRole" type="text" aria-label="Clip role">
                <input id="clipStart" type="number" min="0" step="0.01" aria-label="Clip start">
                <input id="clipEnd" type="number" min="0" step="0.01" aria-label="Clip end">
                <label class="check-row hidden">
                  <input id="clipMuted" type="checkbox">
                  Mute source audio
                </label>

                <div class="inspector-panel" data-panel="position">
                  <div class="property-row scale-row">
                    <span class="property-label">Scale</span>
                    <input id="clipScale" class="property-slider" type="range" min="0.1" max="2" step="0.01" value="1" aria-label="Scale">
                    <div class="number-stepper percent-stepper">
                      <span class="stepper-icon">⇲</span>
                      <input id="clipScaleNumber" type="number" min="10" max="200" step="1" value="100" aria-label="Scale percent">
                      <span>%</span>
                    </div>
                    <button class="keyframe-button" type="button" aria-label="Scale keyframe">◇</button>
                  </div>

                  <div class="xy-grid property-grid">
                    <label>
                      <span>X</span>
                      <div class="number-stepper">
                        <input id="clipX" type="number" value="0" aria-label="X position">
                      </div>
                    </label>
                    <label>
                      <span>Y</span>
                      <div class="number-stepper">
                        <input id="clipY" type="number" value="0" aria-label="Y position">
                      </div>
                    </label>
                  </div>

                  <div class="property-row">
                    <span class="property-label">Rotation</span>
                    <input id="clipRotation" class="property-slider" type="range" min="-180" max="180" value="0" aria-label="Rotation">
                    <div class="number-stepper degree-stepper">
                      <span class="stepper-icon">◌</span>
                      <input id="clipRotationNumber" type="number" min="-180" max="180" step="1" value="0" aria-label="Rotation degrees">
                      <span>°</span>
                    </div>
                    <button class="keyframe-button" type="button" aria-label="Rotation keyframe">◇</button>
                  </div>

                  <div class="property-row mirror-property">
                    <span class="property-label">Mirror</span>
                    <div class="mirror-row">
                      <button id="flipHButton" type="button" aria-label="Flip horizontal">↔</button>
                      <button id="flipVButton" type="button" aria-label="Flip vertical">↕</button>
                    </div>
                  </div>
                </div>

                <div class="inspector-panel hidden" data-panel="speed">
                  <div class="property-row">
                    <span class="property-label">Speed</span>
                    <input id="clipSpeed" class="property-slider" type="range" min="0.25" max="4" step="0.05" value="1" aria-label="Speed">
                    <div class="number-stepper">
                      <input id="clipSpeedNumber" type="number" min="0.25" max="4" step="0.05" value="1" aria-label="Speed value">
                      <span>x</span>
                    </div>
                  </div>
                </div>

                <div class="inspector-panel hidden" data-panel="blend">
                  <div class="property-row">
                    <span class="property-label">Opacity</span>
                    <input id="clipOpacity" class="property-slider" type="range" min="0" max="1" step="0.01" value="1" aria-label="Opacity">
                    <div class="number-stepper percent-stepper">
                      <input id="clipOpacityNumber" type="number" min="0" max="100" step="1" value="100" aria-label="Opacity percent">
                      <span>%</span>
                    </div>
                  </div>
                </div>

                <div class="inspector-panel hidden" data-panel="mask">
                  <div class="inspector-placeholder">Mask controls are reserved for the full renderer.</div>
                </div>

                <div class="inspector-footer">
                  <button id="resetInspectorButton" type="button">Reset attributes</button>
                  <div class="inspector-actions">
                    <button id="duplicateButton" class="button ghost" type="button">Duplicate</button>
                    <button id="deleteButton" class="button danger" type="button">Delete</button>
                  </div>
                </div>
              </form>
              <form id="audioForm" class="clip-form audio-form hidden">
                <label>
                  Narration volume
                  <input id="narrationVolume" type="range" min="0" max="1.5" value="1" step="0.01">
                </label>
                <label>
                  Music volume
                  <input id="musicVolume" type="range" min="0" max="1.5" value="0.35" step="0.01">
                </label>
              </form>
            </aside>
          </div>

          <section class="timeline-panel" aria-label="Timeline">
            <div class="timeline-toolbar">
              <div class="tool-buttons">
                <button id="selectToolButton" type="button" title="Select"></button>
                <button id="splitButton" type="button" title="Split at playhead"></button>
                <button id="trimStartButton" type="button" title="Trim start to playhead"></button>
                <button id="trimEndButton" type="button" title="Trim end to playhead"></button>
                <button id="linkButton" type="button" title="Linked selection"></button>
                <button id="timelineDuplicateButton" type="button" title="Duplicate"></button>
                <button id="timelineDeleteButton" type="button" title="Delete"></button>
                <span class="tool-divider" aria-hidden="true"></span>
                <button id="shieldButton" type="button" title="Lock or unlock video track"></button>
                <button id="waveformButton" type="button" title="Show or hide waveforms"></button>
                <span class="tool-divider" aria-hidden="true"></span>
                <button id="undoButton" type="button" title="Undo"></button>
                <button id="redoButton" type="button" title="Redo"></button>
              </div>
              <div class="timeline-zoom">
                <span id="durationReadout">00:00</span>
                <span>−</span>
                <input type="range" min="0" max="100" value="58" aria-label="Timeline zoom">
                <span>＋</span>
              </div>
            </div>
            <div class="timeline-stage">
              <div class="track-labels">
                <div class="track-label">Video</div>
                <div class="track-label">Narr</div>
                <div class="track-label">Music</div>
              </div>
              <div class="track-area">
                <div id="timelineRuler" class="timeline-ruler"></div>
                <div class="playhead" aria-hidden="true"></div>
                <div id="timelineList" class="timeline-list"></div>
                <div id="audioTimelineList" class="audio-timeline-list"></div>
              </div>
            </div>
          </section>
        </section>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
